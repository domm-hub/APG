<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify — AllProGamerz</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
  <div class="card auth-card" style="text-align:center;">
    <div class="logo">AP<span>G</span></div>
    <h1 style="font-size:18px;font-weight:700;margin:0 0 8px;">Verify your account</h1>
    <p style="font-size:14px;color:var(--text-muted);margin:0 0 24px;">We sent a code to<br><strong style="color:var(--text);" id="emailTarget">your email</strong></p>
    <input type="text" id="pinInput" class="pin-input" placeholder="0000" maxlength="4" autocomplete="one-time-code">
    <button class="btn btn-primary btn-block" id="verifyBtn">Verify</button>
    <p class="status" id="statusMessage"></p>
    <p style="font-size:13px;color:var(--text-muted);margin-top:16px;">
      Didn't get it? <a href="#" id="resendLink" style="color:var(--accent);text-decoration:none;font-weight:500;">Resend code</a>
    </p>
  </div>
  <style>
    .pin-input {
      width: 100%;
      padding: 14px;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      outline: none;
      font-family: 'SF Mono', ui-monospace, monospace;
      transition: border-color var(--transition);
      margin-bottom: 20px;
    }
    .pin-input:focus { border-color: var(--accent); }
  </style>
  <script>
    const API = 'https://apg-api.vercel.app';
    const status = document.getElementById('statusMessage');
    const emailTarget = document.getElementById('emailTarget');
    const pendingEmail = sessionStorage.getItem('pending_verification_email');

    if (pendingEmail) {
      emailTarget.innerText = pendingEmail;
    } else {
      window.location.href = 'signup.html';
    }

    document.getElementById('verifyBtn').addEventListener('click', () => {
      const pin = document.getElementById('pinInput').value;
      if (pin.length !== 4) { status.innerText = 'Enter a 4-digit code.'; return; }
      status.innerText = 'Verifying...';
      fetch(API + '/api/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: pendingEmail, code: pin })
      })
      .then(r => r.json())
      .then(data => {
        if (data.status === 'success') {
          status.innerText = 'Verified!';
          status.style.color = 'var(--green)';
          sessionStorage.removeItem('pending_verification_email');
          setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        } else {
          status.innerText = data.message;
        }
      })
      .catch(() => { status.innerText = 'Network error.'; });
    });

    document.getElementById('resendLink').addEventListener('click', (e) => {
      e.preventDefault();
      if (!pendingEmail) return;
      status.innerText = 'Resending...';
      fetch(API + '/api/resend-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: pendingEmail })
      })
      .then(r => r.json())
      .then(data => {
        status.innerText = data.status === 'success' ? 'Code resent!' : data.message;
        status.style.color = data.status === 'success' ? 'var(--green)' : '';
      })
      .catch(() => { status.innerText = 'Network error.'; });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — AllProGamerz</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
  <div class="card auth-card">
    <div class="logo">AP<span>G</span></div>
    <p class="sub">Create your account</p>
    <div class="form-group">
      <label for="firstName">First name</label>
      <input type="text" id="firstName" placeholder="First name" autocomplete="given-name">
    </div>
    <div class="form-group">
      <label for="lastName">Last name</label>
      <input type="text" id="lastName" placeholder="Last name" autocomplete="family-name">
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="displayName">Username</label>
      <input type="text" id="displayName" placeholder="Pick a username" autocomplete="username" maxlength="30">
    </div>
    <div class="form-group">
      <label for="phone">Phone number</label>
      <input type="tel" id="phone" placeholder="Phone number" autocomplete="tel">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Create a password" autocomplete="new-password">
    </div>
    <button class="btn btn-primary btn-block" id="signupBtn">Sign up</button>
    <p class="status" id="userStatus"></p>
    <p class="alt-link">Already have an account? <a href="login.html">Sign in</a></p>
    <a href="index.html" class="back-link">&larr; Back to home</a>
  </div>
  <script src="scripts/signup.js"></script>
</body>
</html>

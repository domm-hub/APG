<div>
  <h2 style="font-size:15px;font-weight:600;margin:0 0 16px;">Request a custom website</h2>
  <p class="coin-balance" id="requestCoinBalance">Website requests cost 50 coins.</p>
  <div class="form-group">
    <label for="Prompt">Describe what you want</label>
    <textarea id="Prompt" rows="4" placeholder="Layout, theme, pages..."></textarea>
  </div>
  <button class="btn btn-primary" id="Btn">Submit</button>
  <p class="status" id="Status"></p>
  <div id="requestsList" style="margin-top:16px;"></div>
</div>

<script>
  var token = sessionStorage.getItem('token');
  var API = 'https://apg-api.vercel.app';
  var userCoins = null;
  var userIsAdmin = false;

  function updateSubmitState() {
    document.getElementById('Btn').disabled = !(userIsAdmin || userCoins === null || userCoins >= 50);
  }

  function loadCoinBalance() {
    fetch(API + '/api/check-session', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.status !== 'authenticated') return;
      var user = data.user;
      userIsAdmin = user.coins_infinite;
      userCoins = user.coins;
      document.getElementById('requestCoinBalance').innerText = userIsAdmin
        ? 'Website requests: unlimited coins'
        : 'Coins: ' + (user.coins || 0) + ' | Website requests cost 50 coins';
      updateSubmitState();
    });
  }

  function loadMyRequests() {
    fetch(API + '/api/requests', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var wrap = document.getElementById('requestsList');
      if (!data.length) { wrap.innerHTML = ''; return; }
      var html = '<h3 style="font-size:13px;color:var(--text-muted);margin:0 0 8px;">Your requests</h3>';
      html += '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Prompt</th><th>Status</th></tr></thead><tbody>';
      data.forEach(function(r) {
        html += '<tr><td>' + new Date(r.created_at).toLocaleString() + '</td><td>' + (r.type === 'challenge' ? 'Challenge' : 'Request') + '</td><td class="prompt-cell">' + r.prompt + '</td><td>' + r.status + '</td></tr>';
      });
      html += '</tbody></table></div>';
      wrap.innerHTML = html;
    });
  }

  document.getElementById('Btn').addEventListener('click', function() {
    var prompt = document.getElementById('Prompt').value.trim();
    var s = document.getElementById('Status');
    if (!prompt) { s.innerText = 'Write something.'; return; }
    fetch(API + '/api/requests', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ prompt: prompt })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      s.innerText = d.roast || d.message;
      if (d.status === 'success') {
        document.getElementById('Prompt').value = '';
        userCoins = d.coins;
        userIsAdmin = d.coins_infinite;
        document.getElementById('requestCoinBalance').innerText = d.coins_infinite
          ? 'Website requests: unlimited coins'
          : 'Coins: ' + (d.coins || 0) + ' | Website requests cost 50 coins';
        updateSubmitState();
      }
      loadMyRequests();
    })
    .catch(function() { s.innerText = 'Network error.'; });
  });

  loadMyRequests();
  loadCoinBalance();
</script>

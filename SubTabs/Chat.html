<div class="chat-layout">
  <div class="chat-sidebar" id="chatSidebar">
    <div class="chat-sidebar-header">
      <h2 style="font-size:15px;font-weight:600;margin:0;">Chat</h2>
      <div style="display:flex;gap:6px;">
        <button class="btn-icon" id="chatNavCreate" title="Create group">+</button>
        <button class="btn-icon" id="chatNavJoin" title="Join by code">&#128269;</button>
      </div>
    </div>
    <div id="chatGroupList" class="chat-group-list">
      <p style="color:var(--text-muted);font-size:13px;padding:12px;">Loading...</p>
    </div>
  </div>

  <div class="chat-main" id="chatMain">
    <div id="chatWelcome" class="chat-welcome">
      <p style="color:var(--text-muted);font-size:14px;">Select a group or create a new one to start chatting.</p>
    </div>

    <div id="chatCreate" style="display:none;padding:20px;">
      <h3 style="font-size:15px;font-weight:600;margin:0 0 16px;">Create Group</h3>
      <div class="form-group">
        <label>Group name</label>
        <input type="text" id="newGroupName" placeholder="e.g. Squad Lobby" maxlength="50">
      </div>
      <div class="form-group">
        <label>Description</label>
        <input type="text" id="newGroupDesc" placeholder="What's this group about?">
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <input type="checkbox" id="newGroupPublic" checked style="width:auto;display:inline;">
        <label for="newGroupPublic" style="margin:0;display:inline;">Public (anyone can find it)</label>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
        <input type="checkbox" id="newGroupCommunity" style="width:auto;display:inline;">
        <label for="newGroupCommunity" style="margin:0;display:inline;">Community (with channels)</label>
      </div>
      <button class="btn btn-primary" id="createGroupBtn">Create group</button>
      <p class="status" id="createGroupStatus"></p>
    </div>

    <div id="chatJoin" style="display:none;padding:20px;">
      <h3 style="font-size:15px;font-weight:600;margin:0 0 16px;">Join Group</h3>
      <div class="form-group">
        <label>Invite code</label>
        <input type="text" id="joinGroupCode" placeholder="Paste invite code here">
      </div>
      <button class="btn btn-primary" id="joinGroupBtn">Join</button>
      <p class="status" id="joinGroupStatus"></p>
    </div>

    <div id="chatWindow" style="display:none;" class="chat-window-wrap">
      <div class="chat-window-header">
        <div>
          <h3 style="font-size:14px;font-weight:600;margin:0;" id="chatTitle">Group</h3>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-ghost btn-sm" id="chatInviteBtn" title="Get invite code">&#128279;</button>
          <button class="btn btn-ghost btn-sm" id="chatAddBtn" title="Add member">+</button>
          <button class="btn btn-ghost btn-sm" id="chatBackBtn" title="Leave chat">&larr;</button>
        </div>
      </div>
      <div id="channelBar" class="channel-bar"></div>
      <div class="chat-messages-area" id="chatMessages">
        <p style="color:var(--text-muted);font-size:13px;text-align:center;padding:40px 0;">No messages yet.</p>
      </div>
      <div id="typingIndicator" class="typing-indicator"></div>
      <div class="chat-input-bar">
        <input type="text" id="chatInput" placeholder="Type a message...">
        <button class="btn btn-primary btn-sm" id="chatSendBtn">Send</button>
      </div>
      <button class="btn btn-ghost btn-sm" id="loadMoreBtn" style="display:none;margin:4px auto;">Load older messages</button>
    </div>
    <div id="chatMembersPanel" class="chat-members-panel">
      <div class="chat-members-header">Members</div>
      <div id="chatMembersList" class="chat-members-list"></div>
    </div>
  </div>

  <div id="chatInviteModal" class="chat-modal" style="display:none;">
    <div class="chat-modal-box">
      <h3 style="font-size:15px;font-weight:600;margin:0 0 4px;">Invite to group</h3>
      <p style="font-size:12px;color:var(--text-muted);margin:0 0 14px;">Share this link with friends to let them join:</p>
      <div id="chatInviteLink" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-family:monospace;font-size:13px;word-break:break-all;margin-bottom:8px;color:var(--accent);cursor:pointer;" title="Click to copy link"></div>
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <button class="btn btn-primary btn-sm" id="chatInviteCopyLink" style="flex:1;">Copy Link</button>
        <button class="btn btn-ghost btn-sm" id="chatInviteShare" style="flex:1;display:none;">Share</button>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:10px;margin-bottom:10px;">
        <p style="font-size:11px;color:var(--text-muted);margin:0 0 6px;">Or share this invite code:</p>
        <div id="chatInviteCode" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;font-family:monospace;font-size:16px;text-align:center;letter-spacing:2px;word-break:break-all;cursor:pointer;font-weight:600;" title="Click to copy code"></div>
      </div>
      <p class="status" id="chatInviteStatus"></p>
      <button class="btn btn-ghost btn-sm" id="chatInviteClose">Close</button>
    </div>
  </div>

  <div id="chatAddModal" class="chat-modal" style="display:none;">
    <div class="chat-modal-box">
      <h3 style="font-size:15px;font-weight:600;margin:0 0 12px;">Add member</h3>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="chatAddUsername" placeholder="Enter username">
      </div>
      <button class="btn btn-primary btn-sm" id="chatAddConfirm">Add</button>
      <p class="status" id="chatAddStatus"></p>
      <button class="btn btn-ghost btn-sm" id="chatAddClose" style="margin-top:8px;">Close</button>
    </div>
  </div>

  <div id="chatChannelModal" class="chat-modal" style="display:none;">
    <div class="chat-modal-box">
      <h3 style="font-size:15px;font-weight:600;margin:0 0 12px;">Create channel</h3>
      <div class="form-group">
        <label>Channel name</label>
        <input type="text" id="chatChannelName" placeholder="e.g. memes" maxlength="50">
      </div>
      <div class="form-group">
        <label>Description</label>
        <input type="text" id="chatChannelDesc" placeholder="What's this channel about?">
      </div>
      <button class="btn btn-primary btn-sm" id="chatChannelConfirm">Create</button>
      <p class="status" id="chatChannelStatus"></p>
      <button class="btn btn-ghost btn-sm" id="chatChannelClose" style="margin-top:8px;">Close</button>
    </div>
  </div>
</div>

<script>
(function() {
  var token = sessionStorage.getItem('token');
  var API = 'https://apg-api.vercel.app';
  var currentGroupId = null;
  var currentGroupCode = null;
  var currentChannelId = null;
  var currentGroupType = 'regular';
  var chatOffset = 0;
  var chatPollTimer = null;
  var typingTimer = null;
  var lastMsgCount = 0;
  var lastMsgSender = null;
  var lastMsgTime = null;

  function escHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function formatTime(sentAt) {
    var t = new Date(sentAt);
    var now = new Date();
    var diffMs = now - t;
    var diffDays = Math.floor(diffMs / 86400000);
    var timeStr = t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    if (diffDays === 0) return 'Today at ' + timeStr;
    if (diffDays === 1) return 'Yesterday at ' + timeStr;
    return t.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + timeStr;
  }

  function isWithinGroupTime(sentAt, minutes) {
    if (!lastMsgTime) return false;
    var diff = new Date(sentAt) - new Date(lastMsgTime);
    return diff < minutes * 60000;
  }

  function chatView(view) {
    ['chatWelcome','chatCreate','chatJoin','chatWindow'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
    var map = { welcome: 'chatWelcome', create: 'chatCreate', join: 'chatJoin', chat: 'chatWindow' };
    var target = document.getElementById(map[view]);
    if (target) target.style.display = '';
    var panel = document.getElementById('chatMembersPanel');
    if (panel) panel.classList.toggle('visible', view === 'chat');
    if (view !== 'chat' && chatPollTimer) { clearTimeout(chatPollTimer); chatPollTimer = null; }
  }

  function highlightActiveGroup() {
    var items = document.querySelectorAll('#chatGroupList .chat-sidebar-item');
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle('active', items[i].dataset.groupId == currentGroupId);
    }
  }

  function loadGroups(callback) {
    var wrap = document.getElementById('chatGroupList');
    if (!wrap) return;
    wrap.innerHTML = '<p style="color:var(--text-muted);font-size:13px;padding:12px;">Loading...</p>';
    fetch(API + '/api/chat/listGroups', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!Array.isArray(data) || !data.length) {
        wrap.innerHTML = '<p style="color:var(--text-muted);font-size:13px;padding:12px;">No groups yet.<br>Tap + to create one.</p>';
        return;
      }
      wrap.innerHTML = '';
      data.forEach(function(g) {
        var div = document.createElement('div');
        div.className = 'chat-sidebar-item' + (g.id === currentGroupId ? ' active' : '');
        div.dataset.groupId = g.id;
        var icons = '';
        if (!g.public) icons += '<span style="font-size:10px;">&#128274;</span> ';
        if (g.group_type === 'community') icons += '<span style="font-size:10px;">#</span> ';
        div.innerHTML = '<div style="font-weight:500;font-size:13px;">' + icons + escHtml(g.name) + '</div>' +
          '<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">' + escHtml(g.description || '') + '</div>';
        div.addEventListener('click', function() { openChat(g.id, g.name, g.code, g.group_type); });
        wrap.appendChild(div);
      });
      if (callback) callback();
    })
    .catch(function() { wrap.innerHTML = '<p style="color:var(--accent);font-size:13px;padding:12px;">Failed to load.</p>'; });
  }

  function openChat(groupId, groupName, groupCode, groupType) {
    currentGroupId = groupId;
    currentGroupCode = groupCode || null;
    currentGroupType = groupType || 'regular';
    currentChannelId = null;
    chatOffset = 0;
    lastMsgCount = 0;
    lastMsgSender = null;
    lastMsgTime = null;
    document.getElementById('chatTitle').innerText = groupName;
    chatView('chat');
    highlightActiveGroup();
    loadChatMembers(groupId);
    loadMessages(true);
    if (currentGroupType === 'community') loadChannels(groupId);
    else { document.getElementById('channelBar').style.display = 'none'; }
    if (chatPollTimer) clearTimeout(chatPollTimer);
    startChatPoll();
  }

  function startChatPoll() {
    if (!currentGroupId) return;
    var delay = document.hidden ? 10000 : 1000;
    chatPollTimer = setTimeout(function() {
      if (!currentGroupId) return;
      if (!document.hidden) {
        loadMessages(false);
        pollTyping();
      }
      startChatPoll();
    }, delay);
  }

  function loadChannels(groupId) {
    var bar = document.getElementById('channelBar');
    fetch(API + '/api/chat/channels?group_id=' + groupId, { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(chs) {
      if (!Array.isArray(chs) || !chs.length) { bar.style.display = 'none'; return; }
      bar.style.display = 'flex';
      bar.innerHTML = '';
      var allBtn = document.createElement('button');
      allBtn.className = 'channel-pill' + (!currentChannelId ? ' active' : '');
      allBtn.innerText = '#general';
      allBtn.addEventListener('click', function() { currentChannelId = null; setActiveChannel(this); loadMessages(true); });
      bar.appendChild(allBtn);
      chs.forEach(function(ch) {
        if (ch.name === 'general') return;
        var btn = document.createElement('button');
        btn.className = 'channel-pill' + (currentChannelId === ch.id ? ' active' : '');
        btn.innerText = '#' + ch.name;
        btn.addEventListener('click', function() { currentChannelId = ch.id; setActiveChannel(this); loadChannelMessages(ch.id, true); });
        bar.appendChild(btn);
      });
      var addBtn = document.createElement('button');
      addBtn.className = 'channel-pill add-channel';
      addBtn.innerText = '+';
      addBtn.title = 'New channel';
      addBtn.addEventListener('click', function() {
        document.getElementById('chatChannelName').value = '';
        document.getElementById('chatChannelDesc').value = '';
        document.getElementById('chatChannelStatus').innerText = '';
        document.getElementById('chatChannelModal').style.display = '';
      });
      bar.appendChild(addBtn);
    }).catch(function() { bar.style.display = 'none'; });
  }

  function setActiveChannel(activeBtn) {
    var pills = document.querySelectorAll('#channelBar .channel-pill');
    for (var i = 0; i < pills.length; i++) pills[i].classList.remove('active');
    activeBtn.classList.add('active');
  }

  function loadChatMembers(groupId) {
    fetch(API + '/api/chat/group?group_id=' + groupId, { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.status !== 'success' || !d.group) return;
      var members = d.group.members || [];
      if (d.group.code) currentGroupCode = d.group.code;
      var list = document.getElementById('chatMembersList');
      if (!list) return;
      list.innerHTML = '';
      var myId = window.authenticatedUser.id;
      var online = [];
      var offline = [];
      members.forEach(function(m) {
        var isOnline = m.last_seen && (Date.now() - new Date(m.last_seen).getTime()) < 60000;
        var full = ((m.firstName || '') + ' ' + (m.lastName || '')).trim() || m.username;
        var initial = full.charAt(0).toUpperCase();
        var isCreator = m.username === d.group.creator;
        var item = document.createElement('div');
        item.className = 'chat-members-item';
        var dotColor = isOnline ? 'var(--green)' : 'var(--text-muted)';
        item.innerHTML = '<div class="chat-members-avatar" style="background:hsl(' + (m.id * 37 % 360) + ',50%,40%);">' + escHtml(initial) + '</div>' +
          '<div class="chat-members-info">' +
            '<div class="chat-members-name">' + escHtml(full) + (isCreator ? ' <span class="chat-members-crown" title="Group owner">&#9733;</span>' : '') + '</div>' +
            '<div class="chat-members-handle">@' + escHtml(m.username) + '</div>' +
            (m.custom_status ? '<div class="chat-members-status">' + escHtml(m.custom_status) + '</div>' : '') +
          '</div>' +
          '<div class="chat-members-dot" style="background:' + dotColor + ';" title="' + (isOnline ? 'Online' : 'Offline') + '"></div>';
        (isOnline ? online : offline).push(item);
      });
      if (online.length > 0) {
        var label = document.createElement('div');
        label.className = 'chat-members-label';
        label.innerText = 'Online \u2014 ' + online.length;
        list.appendChild(label);
        online.forEach(function(el) { list.appendChild(el); });
      }
      if (offline.length > 0) {
        var label2 = document.createElement('div');
        label2.className = 'chat-members-label';
        label2.innerText = 'Offline \u2014 ' + offline.length;
        list.appendChild(label2);
        offline.forEach(function(el) { list.appendChild(el); });
      }
    });
  }

  function loadMessages(isInitial) {
    if (!currentGroupId || currentChannelId) return;
    if (isInitial) { chatOffset = 0; lastMsgSender = null; lastMsgTime = null; }
    fetch(API + '/api/chat/getMessages?group_id=' + currentGroupId + '&limit=50&offset=' + chatOffset, { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.status !== 'success') return;
      var wrap = document.getElementById('chatMessages');
      if (!wrap) return;
      if (isInitial) wrap.innerHTML = '';
      if (!d.messages.length && isInitial) { wrap.innerHTML = '<p style="color:var(--text-muted);font-size:13px;text-align:center;padding:40px 0;">No messages yet.</p>'; return; }
      if (isInitial) {
        var prevSender = null;
        var prevTime = null;
        d.messages.forEach(function(m, i) {
          var grouped = m.sender === prevSender && i > 0 && prevTime && (new Date(m.sent_at) - new Date(prevTime)) < 300000;
          wrap.appendChild(buildMsg(m, grouped));
          prevSender = m.sender;
          prevTime = m.sent_at;
        });
        lastMsgSender = prevSender;
        lastMsgTime = prevTime;
        wrap.scrollTop = wrap.scrollHeight;
      } else {
        var wasAtBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 50;
        var count = 0;
        d.messages.forEach(function(m) {
          if (!document.getElementById('msg-' + m.id)) {
            var grouped = m.sender === lastMsgSender && lastMsgTime && (new Date(m.sent_at) - new Date(lastMsgTime)) < 300000;
            wrap.appendChild(buildMsg(m, grouped));
            lastMsgSender = m.sender;
            lastMsgTime = m.sent_at;
            count++;
          }
        });
        if (count && wasAtBottom) wrap.scrollTop = wrap.scrollHeight;
        if (count > 0 && !document.hidden && 'Notification' in window && Notification.permission === 'granted') {
          var last = d.messages[d.messages.length - 1];
          if (last && last.sender !== window.authenticatedUser.firstName) {
            new Notification('New message in ' + document.getElementById('chatTitle').innerText, { body: last.sender + ': ' + last.content, icon: 'photo.png' });
          }
        }
      }
      var btn = document.getElementById('loadMoreBtn');
      if (btn) btn.style.display = d.messages.length >= 50 ? '' : 'none';
      if (!isInitial && d.messages.length > 0) {
        var myId = window.authenticatedUser.id;
        var unread = d.messages.filter(function(m) { return m.sender !== (window.authenticatedUser.firstName || '') && m.read_by && m.read_by.indexOf(myId) === -1; }).map(function(m) { return m.id; });
        if (unread.length > 0) {
          fetch(API + '/api/chat/markRead', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ group_id: currentGroupId, message_ids: unread }) });
        }
      }
    });
  }

  function loadChannelMessages(channelId, isInitial) {
    if (isInitial) chatOffset = 0;
    fetch(API + '/api/chat/channelMessages?channel_id=' + channelId + '&limit=50', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.status !== 'success') return;
      var wrap = document.getElementById('chatMessages');
      if (!wrap) return;
      if (isInitial) wrap.innerHTML = '';
      if (!d.messages.length && isInitial) { wrap.innerHTML = '<p style="color:var(--text-muted);font-size:13px;text-align:center;padding:40px 0;">No messages yet.</p>'; return; }
      var prevSender = null;
      var prevTime = null;
      d.messages.forEach(function(m, i) {
        var grouped = m.sender === prevSender && i > 0 && prevTime && (new Date(m.sent_at) - new Date(prevTime)) < 300000;
        wrap.appendChild(buildMsg(m, grouped));
        prevSender = m.sender;
        prevTime = m.sent_at;
      });
      wrap.scrollTop = wrap.scrollHeight;
    });
  }

  function buildMsg(m, grouped) {
    var div = document.createElement('div');
    div.id = 'msg-' + m.id;
    var isOwn = m.sender === (window.authenticatedUser || {}).firstName;
    if (m.message_type === 'join' || m.message_type === 'leave') {
      div.className = 'chat-msg chat-msg-system';
      div.innerHTML = '<span class="chat-msg-text">' + escHtml(m.content) + '</span>';
    } else {
      var cls = 'chat-msg';
      if (isOwn) cls += ' chat-msg-own';
      div.className = cls;
      var readCheck = '';
      if (m.read_by && m.read_by.length > 0) {
        readCheck = '<span style="font-size:10px;color:var(--green);margin-left:6px;" title="Seen by ' + m.read_by.length + '">&#10003;&#10003;</span>';
      } else if (m.username && m.username !== (window.authenticatedUser || {}).username) {
        readCheck = '<span style="font-size:10px;color:var(--text-muted);margin-left:6px;">&#10003;</span>';
      }
      if (grouped) {
        div.innerHTML = '<div class="chat-msg-text">' + escHtml(m.content) + '</div>';
      } else {
        var senderDisplay = '<span class="chat-msg-sender">' + escHtml(m.sender) + '</span>';
        if (m.username) senderDisplay += ' <span class="chat-msg-username">@' + escHtml(m.username) + '</span>';
        div.innerHTML = '<div class="chat-msg-header">' + senderDisplay + '<span class="chat-msg-time">' + formatTime(m.sent_at) + '</span>' + readCheck + '</div><div class="chat-msg-text">' + escHtml(m.content) + '</div>';
      }
    }
    return div;
  }

  function loadOlderMessages() {
    chatOffset += 50;
    fetch(API + '/api/chat/getMessages?group_id=' + currentGroupId + '&limit=50&offset=' + chatOffset, { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.status !== 'success' || !d.messages.length) return;
      var wrap = document.getElementById('chatMessages');
      if (!wrap) return;
      var fragment = document.createDocumentFragment();
      d.messages.forEach(function(m) {
        if (!document.getElementById('msg-' + m.id)) fragment.appendChild(buildMsg(m, false));
      });
      wrap.insertBefore(fragment, wrap.firstChild);
      var btn = document.getElementById('loadMoreBtn');
      if (btn) btn.style.display = d.messages.length >= 50 ? '' : 'none';
    });
  }

  function sendMessage() {
    var input = document.getElementById('chatInput');
    if (!input) return;
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.focus();
    var url, body;
    if (currentChannelId) {
      url = API + '/api/chat/channelMessages';
      body = JSON.stringify({ channel_id: currentChannelId, message: text });
    } else {
      url = API + '/api/chat/sendmessage';
      body = JSON.stringify({ group_id: currentGroupId, message: text });
    }
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: body
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.status === 'success' && d.message) {
        var wrap = document.getElementById('chatMessages');
        if (wrap) {
          var empty = wrap.querySelector('p');
          if (empty) empty.remove();
          var grouped = d.message.sender === lastMsgSender && lastMsgTime && (new Date(d.message.sent_at) - new Date(lastMsgTime)) < 300000;
          wrap.appendChild(buildMsg(d.message, grouped));
          lastMsgSender = d.message.sender;
          lastMsgTime = d.message.sent_at;
          wrap.scrollTop = wrap.scrollHeight;
        }
      }
    });
  }

  function sendTyping() {
    if (!currentGroupId || currentChannelId) return;
    fetch(API + '/api/chat/typing', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ group_id: currentGroupId })
    }).catch(function() {});
  }

  function pollTyping() {
    if (!currentGroupId || currentChannelId) return;
    fetch(API + '/api/chat/typing?group_id=' + currentGroupId, { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var el = document.getElementById('typingIndicator');
      if (!el) return;
      if (d.typers && d.typers.length > 0) {
        el.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span> ' + escHtml(d.typers.join(', ')) + (d.typers.length === 1 ? ' is typing...' : ' are typing...');
      } else {
        el.innerHTML = '';
      }
    }).catch(function() {});
  }

  setTimeout(function() {
    document.getElementById('chatNavCreate').addEventListener('click', function() { chatView('create'); });
    document.getElementById('chatNavJoin').addEventListener('click', function() { chatView('join'); });
    document.getElementById('chatBackBtn').addEventListener('click', function() { chatView('welcome'); currentGroupId = null; currentChannelId = null; loadGroups(); });
    document.getElementById('chatSendBtn').addEventListener('click', sendMessage);
    document.getElementById('chatInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') sendMessage();
      sendTyping();
    });
    document.getElementById('loadMoreBtn').addEventListener('click', function() { loadOlderMessages(); });

    document.getElementById('createGroupBtn').addEventListener('click', function() {
      var name = document.getElementById('newGroupName').value.trim();
      var desc = document.getElementById('newGroupDesc').value.trim();
      var pub = document.getElementById('newGroupPublic').checked;
      var community = document.getElementById('newGroupCommunity').checked;
      var s = document.getElementById('createGroupStatus');
      if (!name || !desc) { s.innerText = 'Fill in all fields.'; return; }
      s.innerText = 'Creating...';
      fetch(API + '/api/chat/createGroup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ name: name, description: desc, public: pub, group_type: community ? 'community' : 'regular' })
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        s.innerText = d.message;
        if (d.status === 'success') {
          document.getElementById('newGroupName').value = '';
          document.getElementById('newGroupDesc').value = '';
          document.getElementById('newGroupCommunity').checked = false;
          if (d.group_id) openChat(d.group_id, name, d.code, community ? 'community' : 'regular');
        }
      })
      .catch(function() { s.innerText = 'Network error.'; });
    });

    document.getElementById('joinGroupBtn').addEventListener('click', function() {
      var code = document.getElementById('joinGroupCode').value.trim();
      var s = document.getElementById('joinGroupStatus');
      if (!code) { s.innerText = 'Enter an invite code.'; return; }
      s.innerText = 'Joining...';
      fetch(API + '/api/chat/joinByCode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ code: code })
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        s.innerText = d.message;
        if (d.status === 'success') {
          document.getElementById('joinGroupCode').value = '';
          if (d.group_id) setTimeout(function() { openChat(d.group_id, d.group_name); }, 500);
        }
      })
      .catch(function() { s.innerText = 'Network error.'; });
    });

    function showInviteModal(code) {
      var link = window.location.origin + '/chat.html?join=' + code;
      document.getElementById('chatInviteLink').innerText = link;
      document.getElementById('chatInviteCode').innerText = code;
      document.getElementById('chatInviteStatus').innerText = '';
      document.getElementById('chatInviteModal').style.display = '';
      var shareBtn = document.getElementById('chatInviteShare');
      if (navigator.share) {
        shareBtn.style.display = '';
        shareBtn.onclick = function() {
          navigator.share({ title: 'Join my group on APG', url: link }).catch(function() {});
        };
      } else {
        shareBtn.style.display = 'none';
      }
    }

    document.getElementById('chatInviteBtn').addEventListener('click', function() {
      if (currentGroupCode) {
        showInviteModal(currentGroupCode);
      } else {
        fetch(API + '/api/chat/getGroupCode', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ group_id: currentGroupId })
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.status === 'success') {
            currentGroupCode = d.code;
            showInviteModal(d.code);
          }
        });
      }
    });

    document.getElementById('chatInviteLink').addEventListener('click', function() {
      var link = this.innerText;
      if (link && navigator.clipboard) {
        navigator.clipboard.writeText(link);
        document.getElementById('chatInviteStatus').innerText = 'Link copied!';
      }
    });

    document.getElementById('chatInviteCopyLink').addEventListener('click', function() {
      var link = document.getElementById('chatInviteLink').innerText;
      if (link && navigator.clipboard) {
        navigator.clipboard.writeText(link);
        document.getElementById('chatInviteStatus').innerText = 'Link copied!';
      }
    });

    document.getElementById('chatInviteCode').addEventListener('click', function() {
      var code = this.innerText;
      if (code && navigator.clipboard) {
        navigator.clipboard.writeText(code);
        document.getElementById('chatInviteStatus').innerText = 'Code copied!';
      }
    });

    document.getElementById('chatInviteClose').addEventListener('click', function() {
      document.getElementById('chatInviteModal').style.display = 'none';
    });

    document.getElementById('chatAddBtn').addEventListener('click', function() {
      document.getElementById('chatAddUsername').value = '';
      document.getElementById('chatAddStatus').innerText = '';
      document.getElementById('chatAddModal').style.display = '';
    });

    document.getElementById('chatAddConfirm').addEventListener('click', function() {
      var username = document.getElementById('chatAddUsername').value.trim();
      var s = document.getElementById('chatAddStatus');
      if (!username) { s.innerText = 'Enter a username.'; return; }
      s.innerText = 'Adding...';
      fetch(API + '/api/chat/group', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ group_id: currentGroupId, add_user: username })
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        s.innerText = d.message;
        if (d.status === 'success') {
          document.getElementById('chatAddUsername').value = '';
          loadChatMembers(currentGroupId);
        }
      })
      .catch(function() { s.innerText = 'Network error.'; });
    });

    document.getElementById('chatAddClose').addEventListener('click', function() {
      document.getElementById('chatAddModal').style.display = 'none';
    });

    document.getElementById('chatChannelConfirm').addEventListener('click', function() {
      var name = document.getElementById('chatChannelName').value.trim().replace(/[^a-zA-Z0-9_-]/g, '');
      var desc = document.getElementById('chatChannelDesc').value.trim();
      var s = document.getElementById('chatChannelStatus');
      if (!name) { s.innerText = 'Enter a channel name.'; return; }
      s.innerText = 'Creating...';
      fetch(API + '/api/chat/channels', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ group_id: currentGroupId, name: name, description: desc })
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        s.innerText = d.message;
        if (d.status === 'success') {
          document.getElementById('chatChannelName').value = '';
          document.getElementById('chatChannelDesc').value = '';
          loadChannels(currentGroupId);
        }
      })
      .catch(function() { s.innerText = 'Network error.'; });
    });

    document.getElementById('chatChannelClose').addEventListener('click', function() {
      document.getElementById('chatChannelModal').style.display = 'none';
    });

    var joinCode = null;
    var hash = window.location.hash;
    var search = window.location.search;
    if (search.indexOf('join=') !== -1) {
      joinCode = search.split('join=')[1].split('&')[0];
    } else if (hash.indexOf('join=') !== -1) {
      joinCode = hash.split('join=')[1];
    }
    if (joinCode) {
      document.getElementById('joinGroupCode').value = joinCode;
      chatView('join');
      document.getElementById('joinGroupBtn').click();
      history.replaceState(null, '', window.location.pathname);
    }

    loadGroups();
  }, 0);

  window.chatView = chatView;
  window.loadOlderMessages = loadOlderMessages;
})();
</script>

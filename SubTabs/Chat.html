<div>
  <h2 style="font-size:15px;font-weight:600;margin:0 0 16px;">Chat</h2>

  <div style="display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;">
    <button class="btn btn-ghost btn-sm" id="chatNavGroups">Groups</button>
    <button class="btn btn-ghost btn-sm" id="chatNavCreate">Create Group</button>
    <button class="btn btn-ghost btn-sm" id="chatNavJoin">Join Group</button>
  </div>

  <div id="chatGroups">
    <p style="color:var(--text-muted);font-size:13px;">Loading groups...</p>
  </div>

  <div id="chatCreate" style="display:none;">
    <div class="form-group">
      <label>Group name</label>
      <input type="text" id="newGroupName" placeholder="e.g. Squad Lobby" maxlength="50">
    </div>
    <div class="form-group">
      <label>Description</label>
      <input type="text" id="newGroupDesc" placeholder="What's this group about?">
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
      <input type="checkbox" id="newGroupPublic" checked style="width:auto;display:inline;">
      <label for="newGroupPublic" style="margin:0;display:inline;">Public (anyone can find it)</label>
    </div>
    <button class="btn btn-primary" id="createGroupBtn">Create group</button>
    <p class="status" id="createGroupStatus"></p>
  </div>

  <div id="chatJoin" style="display:none;">
    <div class="form-group">
      <label>Group name to join</label>
      <input type="text" id="joinGroupName" placeholder="Exact group name">
    </div>
    <button class="btn btn-primary" id="joinGroupBtn">Find &amp; Join</button>
    <p class="status" id="joinGroupStatus"></p>
  </div>

  <div id="chatWindow" style="display:none;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <h3 style="font-size:14px;font-weight:600;margin:0;" id="chatTitle">Group</h3>
      <button class="btn btn-ghost btn-sm" id="chatBackBtn">&larr; Back</button>
    </div>
    <div id="chatMembers" style="font-size:12px;color:var(--text-muted);margin-bottom:12px;"></div>
    <div id="chatMessages" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;min-height:200px;max-height:400px;overflow-y:auto;margin-bottom:12px;">
      <p style="color:var(--text-muted);font-size:13px;text-align:center;">No messages yet.</p>
    </div>
    <div style="display:flex;gap:8px;">
      <input type="text" id="chatInput" placeholder="Type a message..." style="flex:1;padding:10px 14px;font-size:14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);outline:none;font-family:inherit;">
      <button class="btn btn-primary btn-sm" id="chatSendBtn">Send</button>
    </div>
    <p class="status" id="chatStatus"></p>
    <button class="btn btn-ghost btn-sm" id="loadMoreBtn" style="margin-top:8px;display:none;">Load older messages</button>
  </div>
</div>

<script>
(function() {
  var token = sessionStorage.getItem('token');
  var API = 'https://apg-api.vercel.app';
  var currentGroupId = null;
  var chatOffset = 0;
  var chatPollTimer = null;

  function chatView(view) {
    ['chatGroups','chatCreate','chatJoin','chatWindow'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
    var target = document.getElementById(view === 'groups' ? 'chatGroups' : view === 'create' ? 'chatCreate' : view === 'join' ? 'chatJoin' : 'chatWindow');
    if (target) target.style.display = '';
    if (view === 'groups') loadGroups();
    if (view !== 'chat' && chatPollTimer) { clearInterval(chatPollTimer); chatPollTimer = null; }
  }

  function loadGroups() {
    var wrap = document.getElementById('chatGroups');
    if (!wrap) return;
    wrap.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">Loading...</p>';
    fetch(API + '/api/chat/listGroups', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!Array.isArray(data) || !data.length) { wrap.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">No groups yet. Create one or join with a group name.</p>'; return; }
      wrap.innerHTML = '';
      data.forEach(function(g) {
        var div = document.createElement('div');
        div.className = 'chat-group-item';
        div.innerHTML = '<div><div class="chat-group-name">' + escHtml(g.name) + '</div><div class="chat-group-desc">' + escHtml(g.description || '') + '</div></div>' +
          '<span class="chat-group-badge">' + (g.public ? 'Public' : 'Private') + '</span>';
        div.addEventListener('click', function() { openChat(g.id, g.name); });
        wrap.appendChild(div);
      });
    })
    .catch(function() { wrap.innerHTML = '<p style="color:var(--accent);font-size:13px;">Failed to load groups.</p>'; });
  }

  function openChat(groupId, groupName) {
    currentGroupId = groupId;
    chatOffset = 0;
    var title = document.getElementById('chatTitle');
    if (title) title.innerText = groupName;
    chatView('chat');
    loadChatMembers(groupId);
    loadMessages(true);
    if (chatPollTimer) clearInterval(chatPollTimer);
    chatPollTimer = setInterval(function() { loadMessages(false); }, 5000);
  }

  function loadChatMembers(groupId) {
    fetch(API + '/api/chat/group?group_id=' + groupId, { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.status !== 'success' || !d.group) return;
      var names = (d.group.members || []).map(function(m) { return m.username; });
      var el = document.getElementById('chatMembers');
      if (el) el.innerText = 'Members: ' + names.join(', ');
    });
  }

  function loadMessages(isInitial) {
    if (!currentGroupId) return;
    if (isInitial) chatOffset = 0;
    fetch(API + '/api/chat/getMessages?group_id=' + currentGroupId + '&limit=50&offset=' + chatOffset, { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.status !== 'success') return;
      var wrap = document.getElementById('chatMessages');
      if (!wrap) return;
      if (isInitial) wrap.innerHTML = '';
      if (!d.messages.length && isInitial) { wrap.innerHTML = '<p style="color:var(--text-muted);font-size:13px;text-align:center;">No messages yet.</p>'; return; }
      if (isInitial) {
        d.messages.forEach(function(m) { wrap.appendChild(buildMsg(m)); });
        wrap.scrollTop = wrap.scrollHeight;
      } else {
        var wasAtBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 50;
        var count = 0;
        d.messages.forEach(function(m) {
          if (!document.getElementById('msg-' + m.id)) { wrap.appendChild(buildMsg(m)); count++; }
        });
        if (count && wasAtBottom) wrap.scrollTop = wrap.scrollHeight;
      }
      var btn = document.getElementById('loadMoreBtn');
      if (btn) btn.style.display = d.messages.length >= 50 ? '' : 'none';
    });
  }

  function buildMsg(m) {
    var div = document.createElement('div');
    div.className = 'chat-msg';
    div.id = 'msg-' + m.id;
    var t = new Date(m.sent_at);
    var time = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    div.innerHTML = '<span class="chat-msg-sender">' + escHtml(m.sender) + '</span><span class="chat-msg-time">' + time + '</span><div class="chat-msg-text">' + escHtml(m.content) + '</div>';
    return div;
  }

  function loadOlderMessages() {
    chatOffset += 50;
    fetch(API + '/api/chat/getMessages?group_id=' + currentGroupId + '&limit=50&offset=' + chatOffset, { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.status !== 'success' || !d.messages.length) return;
      var wrap = document.getElementById('chatMessages');
      if (!wrap) return;
      var fragment = document.createDocumentFragment();
      d.messages.forEach(function(m) {
        if (!document.getElementById('msg-' + m.id)) fragment.appendChild(buildMsg(m));
      });
      wrap.insertBefore(fragment, wrap.firstChild);
      var btn = document.getElementById('loadMoreBtn');
      if (btn) btn.style.display = d.messages.length >= 50 ? '' : 'none';
    });
  }

  function sendMessage() {
    var input = document.getElementById('chatInput');
    if (!input) return;
    var text = input.value.trim();
    if (!text || !currentGroupId) return;
    input.value = '';
    fetch(API + '/api/chat/sendmessage', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ group_id: currentGroupId, message: text })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.status === 'success' && d.message) {
        var wrap = document.getElementById('chatMessages');
        if (wrap) { wrap.appendChild(buildMsg(d.message)); wrap.scrollTop = wrap.scrollHeight; }
      }
    });
  }

  function escHtml(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  setTimeout(function() {
    var navGroups = document.getElementById('chatNavGroups');
    var navCreate = document.getElementById('chatNavCreate');
    var navJoin = document.getElementById('chatNavJoin');
    var backBtn = document.getElementById('chatBackBtn');
    var sendBtn = document.getElementById('chatSendBtn');
    var chatInput = document.getElementById('chatInput');
    var loadMore = document.getElementById('loadMoreBtn');
    var createBtn = document.getElementById('createGroupBtn');
    var joinBtn = document.getElementById('joinGroupBtn');

    if (navGroups) navGroups.addEventListener('click', function() { chatView('groups'); });
    if (navCreate) navCreate.addEventListener('click', function() { chatView('create'); });
    if (navJoin) navJoin.addEventListener('click', function() { chatView('join'); });
    if (backBtn) backBtn.addEventListener('click', function() { chatView('groups'); });
    if (sendBtn) sendBtn.addEventListener('click', sendMessage);
    if (chatInput) chatInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendMessage(); });
    if (loadMore) loadMore.addEventListener('click', function() { loadOlderMessages(); });

    if (createBtn) createBtn.addEventListener('click', function() {
      var name = document.getElementById('newGroupName').value.trim();
      var desc = document.getElementById('newGroupDesc').value.trim();
      var pub = document.getElementById('newGroupPublic').checked;
      var s = document.getElementById('createGroupStatus');
      if (!name || !desc) { s.innerText = 'Fill in all fields.'; return; }
      s.innerText = 'Creating...';
      fetch(API + '/api/chat/createGroup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ name: name, description: desc, public: pub })
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        s.innerText = d.message;
        if (d.status === 'success') {
          document.getElementById('newGroupName').value = '';
          document.getElementById('newGroupDesc').value = '';
          chatView('groups');
        }
      })
      .catch(function() { s.innerText = 'Network error.'; });
    });

    if (joinBtn) joinBtn.addEventListener('click', function() {
      var name = document.getElementById('joinGroupName').value.trim();
      var s = document.getElementById('joinGroupStatus');
      if (!name) { s.innerText = 'Enter a group name.'; return; }
      s.innerText = 'Looking up group...';
      fetch(API + '/api/chat/getGroupId?name=' + encodeURIComponent(name), { headers: { 'Authorization': 'Bearer ' + token } })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.status !== 'success') { s.innerText = d.message; return; }
        fetch(API + '/api/chat/group', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ group_id: d.group_id })
        })
        .then(function(r) { return r.json(); })
        .then(function(res) {
          s.innerText = res.message || 'Joined!';
          if (res.status === 'success') { setTimeout(function() { openChat(d.group_id, name); }, 500); }
        });
      })
      .catch(function() { s.innerText = 'Network error.'; });
    });

    loadGroups();
  }, 0);

  window.chatView = chatView;
  window.loadOlderMessages = loadOlderMessages;
})();
</script>

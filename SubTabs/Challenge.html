<div>
  <h2 style="font-size:15px;font-weight:600;margin:0 0 16px;">Weekly challenge</h2>
  <div class="form-group">
    <label for="challengeText">Describe your proof</label>
    <textarea id="challengeText" rows="3" placeholder="What did you do?"></textarea>
  </div>
  <button class="btn btn-primary" id="challengeBtn">Submit</button>
  <p class="status" id="challengeStatus"></p>
</div>

<script>
  var token = sessionStorage.getItem('token');
  document.getElementById('challengeBtn').addEventListener('click', function() {
    var text = document.getElementById('challengeText').value.trim();
    var s = document.getElementById('challengeStatus');
    if (!text) { s.innerText = 'Write something.'; return; }
    fetch('https://apg-api.vercel.app/api/requests', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ prompt: text, type: 'challenge' })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      s.innerText = d.roast || d.message;
      if (d.status === 'success') document.getElementById('challengeText').value = '';
    })
    .catch(function() { s.innerText = 'Network error.'; });
  });
</script>

<div>
  <h2 style="font-size:15px;font-weight:600;margin:0 0 16px;">Profile</h2>
  <p class="coin-balance" id="coinBalance">Coins: loading...</p>

  <div class="section">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;">
      <button class="btn btn-ghost btn-sm" id="generateInviteBtn">Generate invite link</button>
      <p class="status" id="inviteStatus"></p>
      <div id="inviteList"></div>
    </div>
  </div>

  <div class="section">
    <p id="profileInfo" style="font-size:14px;color:var(--text-muted);line-height:1.7;">Loading...</p>
    <div id="editProfile" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
      <h3 style="font-size:14px;font-weight:600;margin:0 0 12px;">Edit profile</h3>
      <div class="form-group">
        <label>First name</label>
        <input type="text" id="editFirstName" placeholder="First name">
      </div>
      <div class="form-group">
        <label>Last name</label>
        <input type="text" id="editLastName" placeholder="Last name">
      </div>
      <div class="form-group">
        <label>Custom status</label>
        <input type="text" id="editCustomStatus" placeholder="What's on your mind?" maxlength="100">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="editEmail" disabled>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" id="editPhone" placeholder="Phone">
      </div>
      <div class="form-group">
        <label>Current password (required to change password)</label>
        <input type="password" id="editCurrentPass" placeholder="Current password">
      </div>
      <div class="form-group">
        <label>New password (leave blank to keep current)</label>
        <input type="password" id="editNewPass" placeholder="New password">
      </div>
      <button class="btn btn-primary" id="saveProfileBtn">Save</button>
      <p class="status" id="editStatus"></p>
    </div>
  </div>

  <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);">
    <button class="btn btn-ghost btn-sm" id="showAdminClaimBtn" style="color:var(--text-muted);">Get admin</button>
    <div id="adminClaimSection" style="display:none;margin-top:12px;">
      <div class="form-group">
        <label>Admin password</label>
        <input type="password" id="adminPassInput" placeholder="Enter password">
      </div>
      <button class="btn btn-primary btn-sm" id="claimAdminBtn">Claim admin</button>
      <p class="status" id="adminClaimStatus"></p>
    </div>
    <button class="btn btn-ghost btn-sm" id="showRemoveAdminBtn" style="display:none;color:var(--text-muted);">Remove admin</button>
    <div id="removeAdminSection" style="display:none;margin-top:12px;">
      <div class="form-group">
        <label>Admin password</label>
        <input type="password" id="removeAdminPassInput" placeholder="Enter password">
      </div>
      <button class="btn btn-danger btn-sm" id="removeAdminBtn">Remove admin</button>
      <p class="status" id="removeAdminStatus"></p>
    </div>
  </div>
</div>

<script>
  var token = sessionStorage.getItem('token');
  var API = 'https://apg-api.vercel.app';

  function loadInvites() {
    fetch(API + '/api/invites', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var list = document.getElementById('inviteList');
      if (!Array.isArray(data)) return;
      list.innerHTML = data.map(function(invite) {
        return '<p style="margin:8px 0 0;font-size:13px;overflow-wrap:anywhere;"><a href="' + invite.link + '" target="_blank" style="color:var(--accent);">' + invite.link + '</a> <span style="color:var(--text-muted);">(' + invite.uses + '/' + invite.max_uses + ' used)</span></p>';
      }).join('');
    })
    .catch(function() { document.getElementById('inviteStatus').innerText = 'Unable to load invites.'; });
  }

  document.getElementById('generateInviteBtn').addEventListener('click', function() {
    var status = document.getElementById('inviteStatus');
    status.innerText = 'Generating...';
    fetch(API + '/api/invites', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      status.innerText = data.status === 'success' ? 'Invite link created.' : data.message;
      if (data.status === 'success') loadInvites();
    })
    .catch(function() { status.innerText = 'Network error.'; });
  });

  function populateProfileUI() {
    fetch(API + '/api/check-session', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.status !== 'success' && data.status !== 'authenticated') return;
      var u = data.user;
      document.getElementById('profileInfo').innerHTML =
        'Name: ' + (u.firstName || '') + ' ' + (u.lastName || '') + '<br>Email: ' + u.email + '<br>Verified: ' + (u.verified ? 'yes' : 'no');
      document.getElementById('editEmail').value = u.email;
      document.getElementById('editFirstName').value = u.firstName || '';
      document.getElementById('editLastName').value = u.lastName || '';
      document.getElementById('editCustomStatus').value = u.custom_status || '';
      document.getElementById('coinBalance').innerText = u.coins_infinite ? 'Coins: unlimited' : 'Coins: ' + (u.coins || 0);
      if (u.is_admin) document.getElementById('showRemoveAdminBtn').style.display = '';
    });
  }

  document.getElementById('showAdminClaimBtn').addEventListener('click', function() {
    var box = document.getElementById('adminClaimSection');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('claimAdminBtn').addEventListener('click', function() {
    var pw = document.getElementById('adminPassInput').value;
    var s = document.getElementById('adminClaimStatus');
    if (!pw) { s.innerText = 'Enter password.'; return; }
    s.innerText = 'Checking...';
    fetch(API + '/api/claim-admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ password: pw })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) { s.innerText = d.message; if (d.status === 'success') setTimeout(function() { parent.location.reload(); }, 1000); })
    .catch(function() { s.innerText = 'Network error.'; });
  });

  document.getElementById('showRemoveAdminBtn').addEventListener('click', function() {
    var box = document.getElementById('removeAdminSection');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('removeAdminBtn').addEventListener('click', function() {
    var pw = document.getElementById('removeAdminPassInput').value;
    var s = document.getElementById('removeAdminStatus');
    if (!pw) { s.innerText = 'Enter password.'; return; }
    s.innerText = 'Checking...';
    fetch(API + '/api/remove-admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ password: pw })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) { s.innerText = d.message; if (d.status === 'success') setTimeout(function() { parent.location.reload(); }, 1000); })
    .catch(function() { s.innerText = 'Network error.'; });
  });

  document.getElementById('saveProfileBtn').addEventListener('click', function() {
    var fn = document.getElementById('editFirstName').value.trim();
    var ln = document.getElementById('editLastName').value.trim();
    var cs = document.getElementById('editCustomStatus').value.trim();
    var curPass = document.getElementById('editCurrentPass').value;
    var newPass = document.getElementById('editNewPass').value;
    var s = document.getElementById('editStatus');
    if (!fn || !ln) { s.innerText = 'First and last name are required.'; return; }
    if (newPass && !curPass) { s.innerText = 'Enter current password to change password.'; return; }
    s.innerText = 'Saving...';
    var body = { firstName: fn, lastName: ln, custom_status: cs };
    if (newPass) { body.current_password = curPass; body.new_password = newPass; }
    fetch(API + '/api/update-profile', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(body)
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      s.innerText = d.message;
      if (d.status === 'success') {
        document.getElementById('editCurrentPass').value = '';
        document.getElementById('editNewPass').value = '';
        populateProfileUI();
      }
    })
    .catch(function() { s.innerText = 'Network error.'; });
  });

  populateProfileUI();
  loadInvites();
</script>
